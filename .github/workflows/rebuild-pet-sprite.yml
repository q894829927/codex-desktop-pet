name: Rebuild pet sprite

on:
  push:
    branches: [fix/full-multipose-sprite]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-multipose-sprite
          fetch-depth: 0

      - name: Rebuild and verify PNG
        shell: bash
        run: |
          if [ ! -f .sprite-chunks/part-00 ]; then
            echo "No sprite chunks; nothing to rebuild."
            exit 0
          fi
          cat .sprite-chunks/part-* > /tmp/poses.b64
          test "$(wc -c < /tmp/poses.b64)" -eq 76568
          base64 -d /tmp/poses.b64 > public/assets/pet/poses.png
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("public/assets/pet/poses.png")
          data = p.read_bytes()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "invalid PNG header"
          assert len(data) == 57426, f"unexpected size: {len(data)}"
          digest = hashlib.sha256(data).hexdigest()
          assert digest == "80c726e0ff0692ac7a88d141c9a8426e1661d6e2954d55bc7ed4afe04bdd4852", digest
          print("sprite bytes:", len(data))
          print("sha256:", digest)
          PY

      - name: Commit rebuilt sprite
        shell: bash
        run: |
          if git diff --quiet -- public/assets/pet/poses.png; then
            echo "Sprite already correct."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/pet/poses.png
          git commit -m "fix: rebuild complete multipose sprite"
          git push origin HEAD:fix/full-multipose-sprite
